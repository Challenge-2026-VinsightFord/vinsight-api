# === Perfil TEST - MySQL local, schema DEDICADO =============================
# Aponta para vinsight_test, nunca para o vinsight da demonstracao. Isso evita
# que a suite grave no banco usado na apresentacao e que os testes dependam da
# massa de demonstracao (V900 nao e carregado aqui: locations so tem db/migration).
#
# O schema e criado sozinho por createDatabaseIfNotExist=true.
# Para zerar do zero: DROP DATABASE vinsight_test;
spring.datasource.url=${DB_TEST_URL:jdbc:mysql://localhost:3306/vinsight_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:fiap}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# validate: o schema vem das migrations reais, e o Hibernate confere que as
# entidades batem com ele. Divergencia entidade/migration quebra o build.
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Rate limit do login (LimiteTentativasLogin): o relogio dos testes e fixo, entao a janela nunca
# venceria e as falhas de login de todas as classes se somariam no mesmo IP (127.0.0.1).
# O limite real (5) e testado em LimiteTentativasLoginTest, com contexto proprio.
api.security.login.max-falhas=1000
