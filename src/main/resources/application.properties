spring.application.name=vinsight-api
server.port=8080

# Perfil padrao: dev. Sobrescreva com SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# === JPA / Hibernate (comum aos perfis) ===
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# === Flyway ===
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# === Jackson (Jackson 3.x - datas ja sao ISO-8601 por default) ===
spring.jackson.time-zone=America/Sao_Paulo
# Jackson 3 passou a falhar quando um campo primitivo (ex.: boolean optInWhatsApp) vem ausente.
# Volta ao comportamento do Jackson 2: ausente = valor padrao (false/0)
spring.jackson.deserialization.fail-on-null-for-primitives=false

# === SpringDoc / Swagger ===
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
# US-32: os codigos de resposta de cada endpoint vem de DocumentacaoRespostas. Sem isto, o springdoc
# copiaria todos os @ExceptionHandler para todos os endpoints, inclusive erros que eles nao geram.
springdoc.override-with-generic-response=false
# Respostas de sucesso como application/json (o padrao do springdoc e */*)
springdoc.default-produces-media-type=application/json
# Mostra o /actuator/health, endpoint publico do contrato
springdoc.show-actuator=true
# O token do Authorize sobrevive a um F5 na pagina; "Try it out" ja vem aberto
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.display-request-duration=true

# === Actuator: apenas o health check publico exigido pelo contrato ===
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Sem os grupos liveness/readiness (Kubernetes): a resposta fica {"status":"UP"}, como no contrato
management.endpoint.health.probes.enabled=false
# Sem a pagina de indice /actuator (lista de links): so o /actuator/health fica exposto
management.endpoints.web.discovery.enabled=false

# === Erros e logs (US-31) ===
# Mensagens do Bean Validation em portugues nas "violacoes" do problem+json
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed
# Toda linha de log sai com o correlationId da requisicao (CorrelationIdFilter)
# (\u0020 = espaco final; um espaco literal no fim do valor seria descartado)
logging.pattern.correlation=[%X{correlationId:-}]\u0020

# === Seguranca (US-29) ===
api.security.token.secret=${JWT_SECRET:vinsight-ford-challenge-2026-secret}
api.security.token.access-expiration-minutes=15
api.security.token.refresh-expiration-hours=8
# Rate limit do login (LimiteTentativasLogin): falhas por IP antes do 429, e duracao da janela
api.security.login.max-falhas=5
api.security.login.janela-segundos=60
