# === Perfil PROD - tudo por variavel de ambiente, nada de credencial no repositorio ===
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# Sem massa de demonstracao. ignore-migration-patterns evita falha caso o banco
# tenha sido usado antes em dev e carregue o seed (V900) no historico do Flyway.
spring.flyway.locations=classpath:db/migration
spring.flyway.ignore-migration-patterns=*:missing

# === Seguranca em producao ===
# Sem valor padrao: sem a variavel JWT_SECRET a aplicacao NAO sobe (o default de dev fica no
# application.properties so para desenvolvimento). TokenService ainda exige >= 32 bytes.
# Gerar: openssl rand -base64 48
api.security.token.secret=${JWT_SECRET}

# === Logs estruturados (JSON, formato Elastic Common Schema) ===
# Uma linha JSON por evento, com correlationId (MDC), logger (AUDITORIA) e nivel: pronta para
# Elasticsearch/Loki/CloudWatch sem parser de texto. Dev continua com o log legivel de console.
logging.structured.format.console=ecs
logging.structured.ecs.service.name=vinsight-api
logging.structured.ecs.service.environment=prod
